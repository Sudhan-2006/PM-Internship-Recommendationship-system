<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .table th {
            background-color: #343a40;
            color: white;
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="fas fa-bars"></i>
    </a>

    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
        Login
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="/login">User Login</a></li>
        <li><a class="dropdown-item" href="/admin_login">Admin Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<div class="container mt-5">

    <!-- Header -->
    <div class="card p-4 mb-4">
        <h3 class="text-danger text-center">
            <i class="fa fa-user-shield"></i> Admin Dashboard
        </h3>
        <p class="text-center text-muted mb-0">
            Secure view – user details are protected
        </p>
    </div>

    <!-- User Table -->
    <div class="card p-4">
        <h5 class="mb-3">
            <i class="fa fa-users"></i> Registered Users
        </h5>

        <div class="table-responsive">
            <table class="table table-bordered table-hover text-center align-middle">
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>Email ID (Masked)</th>
                        <th>Password</th>
                        <th>Account Status</th>
                    </tr>
                </thead>
                <tbody>

                    {% for u in users %}
                    <tr>
                        <td>{{ u.name }}</td>
                        <td>{{ u.email }}</td>
                        <td>
                            <span class="badge bg-secondary">Encrypted</span>
                        </td>
                        <td>
                            <span class="badge bg-success">Active</span>
                        </td>
                    </tr>
                    {% endfor %}

                </tbody>
            </table>
        </div>
    </div>

    <p class="text-center text-muted mt-4">
        © PM Internship Scheme | Admin Panel
    </p>

</div>

</body>
</html>
