<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #9face6);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .form-control {
            border-radius: 10px;
        }
        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="fas fa-bars"></i>
    </a>

    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
        Login
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="/login">User Login</a></li>
        <li><a class="dropdown-item" href="/admin_login">Admin Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<div class="container d-flex justify-content-center align-items-center">
    <div class="card p-4 mt-5" style="width:420px;">

        <h4 class="text-center text-primary">
            <i class="fa fa-user-plus"></i> User Registration
        </h4>

        <!-- Signup Form -->
        <form method="POST" action="/signup">

            <input type="text" name="name" class="form-control mt-3"
                   placeholder="Full Name" required>

            <input type="email" name="email" class="form-control mt-3"
                   placeholder="Email ID" required>

            <input type="password" name="password" class="form-control mt-3"
                   placeholder="Password" required>

            <button type="submit" class="btn btn-success w-100 mt-4">
                Register
            </button>

        </form>

        <hr class="my-4">

        <p class="text-center mb-2">
            Already have an account?
        </p>

        <!-- ✅ FIXED LINK -->
        <a href="/login" class="btn btn-outline-primary w-100">
            <i class="fa fa-sign-in-alt"></i> Existing User Login
        </a>

    </div>
</div>

</body>
</html>
