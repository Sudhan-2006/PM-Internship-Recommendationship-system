<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PM Internship Recommendation System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #9face6);
        }
        .card {
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
     
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="fas fa-bars"></i>
    </a>

    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
        Login
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="/login">User Login</a></li>
        <li><a class="dropdown-item" href="/admin_login">Admin Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<div class="container text-center mt-5">

    <!-- Logo and Title -->
   <img src="{{ url_for('static', filename='images/logo.png') }}"
     width="100"
     alt="Logo">

    <h2 class="text-primary mt-3">
        AI-Based Internship Recommendation System
    </h2>
    <p class="text-dark">
        For PM Internship Scheme
    </p>

    <!-- Cards -->
    <div class="row mt-5 justify-content-center">

        <!-- User Login Card -->
        <div class="col-md-4 col-sm-10 mb-4">
            <div class="card p-4 shadow" onclick="location.href='/signup'">
                <i class="fa-solid fa-user-graduate fa-3x text-success"></i>
                <h4 class="mt-3">User Login</h4>
                <p>Find internships based on your profile</p>
            </div>
        </div>

        <!-- Admin Login Card -->
        <div class="col-md-4 col-sm-10 mb-4">
            <div class="card p-4 shadow" onclick="location.href='/admin_login'">
                <i class="fa-solid fa-user-shield fa-3x text-primary"></i>
                <h4 class="mt-3">Admin Login</h4>
                <p>Manage internships and data</p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
