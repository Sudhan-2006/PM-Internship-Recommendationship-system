<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Details | PM Internship</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body{
            background:#f4f6f9;
        }
        .card{
            border-radius:15px;
            box-shadow:0 6px 15px rgba(0,0,0,0.12);
        }
        .section-title{
            font-weight:600;
            color:#0d6efd;
            margin-top:20px;
        }
        .form-control,.form-select{
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="container my-5">

    <div class="card p-4">

        <h3 class="text-center text-primary mb-4">
            <i class="fa fa-id-card"></i> User Details
        </h3>

        <form method="POST">

            <!-- ================= PERSONAL INFO ================= -->
            <h5 class="section-title">
                <i class="fa fa-user"></i> Personal Information
            </h5>
            <hr>

            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" name="full_name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col-md-6">
                    <input type="email" name="email" class="form-control" placeholder="Email ID" required>
                </div>

                <div class="col-md-6">
                    <input type="text" name="mobile" class="form-control" placeholder="Mobile Number" required>
                </div>
                <div class="col-md-6">
                    <input type="date" name="dob" class="form-control">
                </div>

                <div class="col-md-4">
                    <select name="gender" class="form-select">
                        <option value="">Gender (Optional)</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="text" name="city" class="form-control" placeholder="City">
                </div>
                <div class="col-md-4">
                    <input type="text" name="state" class="form-control" placeholder="State">
                </div>

                <div class="col-md-6">
                    <input type="text" name="country" class="form-control" placeholder="Country" value="India">
                </div>
            </div>

            <!-- ================= EDUCATION ================= -->
            <h5 class="section-title mt-4">
                <i class="fa fa-graduation-cap"></i> Education Details
            </h5>
            <hr>

            <div class="row g-3">
                <div class="col-md-4">
                    <select name="qualification" class="form-select" required>
                        <option value="">Highest Qualification</option>
                        <option>Diploma</option>
                        <option>UG</option>
                        <option>PG</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <input type="text" name="degree" class="form-control"
                           placeholder="Degree (B.E / B.Tech / MBA)">
                </div>

                <div class="col-md-4">
                    <input type="text" name="specialization" class="form-control"
                           placeholder="Branch / Specialization">
                </div>

                <div class="col-md-6">
                    <input type="text" name="college" class="form-control"
                           placeholder="College / University Name">
                </div>

                <div class="col-md-3">
                    <input type="text" name="passing_year" class="form-control"
                           placeholder="Year of Passing">
                </div>

                <div class="col-md-3">
                    <input type="text" name="cgpa" class="form-control"
                           placeholder="CGPA / Percentage (Optional)">
                </div>
            </div>

            <!-- SUBMIT -->
            <div class="text-center mt-4">
                <button class="btn btn-primary px-5">
                    <i class="fa fa-arrow-right"></i> Next
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
